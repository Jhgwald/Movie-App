    const StarIcon = () => (

    // ==================== MAIN APP COMPONENT ====================

    function MovieMatchApp() {
      const [activeTab, setActiveTab] = useState('feed');
      const [contentType, setContentType] = useState('movies');
      const [showOnlyMyServices, setShowOnlyMyServices] = useState(false);
      const [userServices, setUserServices] = useState(['Netflix', 'HBO Max']);
      const [currentMovieIndex, setCurrentMovieIndex] = useState(0);
      const [watchlist, setWatchlist] = useState([]);
      const [seenMovies, setSeenMovies] = useState([]);
      const [showDetailsModal, setShowDetailsModal] = useState(false);
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [customLists, setCustomLists] = useState([
        { id: 1, name: "Holiday Favorites", movies: [] },
        { id: 2, name: "Comedies", movies: [] },
        { id: 3, name: "Date Night", movies: [] }
      ]);

      // Watch Party state
      const [partyState, setPartyState] = useState('home'); // home, create, waiting, matching, matched
      const [partyName, setPartyName] = useState('');
      const [partyCode, setPartyCode] = useState('');
      const [partyMembers, setPartyMembers] = useState([]);
      const [currentPartyMovieIndex, setCurrentPartyMovieIndex] = useState(0);
      const [partyVotes, setPartyVotes] = useState({});
      const [matchedMovie, setMatchedMovie] = useState(null);

      // Search state
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState(SAMPLE_MOVIES);

      // Get filtered movies based on user services
      const getFilteredMovies = () => {
        if (!showOnlyMyServices) return SAMPLE_MOVIES;

        return SAMPLE_MOVIES.filter(movie =>
          movie.streaming.some(s => userServices.includes(s.service))
        );
      };

      const currentMovies = getFilteredMovies();
      const currentMovie = currentMovies[currentMovieIndex];

      // Handle swipe actions
      const handleSwipe = (action) => {
        if (!currentMovie) return;

        if (action === 'watchlist') {
          if (!watchlist.find(m => m.id === currentMovie.id)) {
            setWatchlist([...watchlist, currentMovie]);
          }
        } else if (action === 'seen') {
          if (!seenMovies.find(m => m.id === currentMovie.id)) {
            setSeenMovies([...seenMovies, currentMovie]);
          }
        }

        // Move to next movie
        setCurrentMovieIndex((prev) => (prev + 1) % currentMovies.length);
      };

      const openDetails = (movie) => {
        setSelectedMovie(movie);
        setShowDetailsModal(true);
      };

      const getRatingColor = (type) => {
        const colors = {
          imdb: 'bg-yellow-500',
          rt: 'bg-red-500',
          rtAudience: 'bg-red-400',
          tmdb: 'bg-blue-500'
        };
        return colors[type] || 'bg-gray-500';
      };

      const getRatingLabel = (type) => {
        const labels = {
          imdb: 'IMDb',
          rt: 'RT Critics',
          rtAudience: 'RT Audience',
          tmdb: 'TMDb'
        };
        return labels[type] || type;
      };

      // ==================== FEED TAB ====================

      const renderFeed = () => {
        if (!currentMovie) {
          return (
            <div className="flex items-center justify-center h-96">
              <p className="text-gray-500">No more movies to show!</p>
            </div>
          );
        }

        return (
          <div className="pb-20">
            {/* Filter Bar */}
            <div className="bg-white p-4 shadow-sm sticky top-0 z-10">
              <div className="max-w-md mx-auto">
                <div className="flex gap-2 mb-3">
                  <button
                    onClick={() => setContentType('movies')}
                    className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                      contentType === 'movies'
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'bg-gray-200 text-gray-700'
                    }`}
                  >
                    Movies
                  </button>
                  <button
                    onClick={() => setContentType('tv')}
                    className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                      contentType === 'tv'
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'
                        : 'bg-gray-200 text-gray-700'
                    }`}
                  >
                    TV Shows
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="myServices"
                    checked={showOnlyMyServices}
                    onChange={(e) => setShowOnlyMyServices(e.target.checked)}
                    className="w-4 h-4"
                  />
                  <label htmlFor="myServices" className="text-sm text-gray-700">
                    Show only my services
                  </label>
                </div>
              </div>
            </div>

            {/* Movie Card */}
            <div className="max-w-md mx-auto px-4 mt-6">
              <div className="bg-white rounded-3xl shadow-2xl overflow-hidden">
                {/* Poster */}
                <div className="relative">
                  <img
                    src={currentMovie.poster}
                    alt={currentMovie.title}
                    className="w-full h-96 object-cover"
                  />
                  <div className="absolute bottom-0 left-0 right-0 gradient-overlay p-6">
                    <h2 className="text-white text-3xl font-bold mb-2">
                      {currentMovie.title}
                    </h2>
                    <div className="flex gap-2 mb-2 flex-wrap">
                      {Object.entries(currentMovie.ratings).map(([type, rating]) => (
                        <span
                          key={type}
                          className={`${getRatingColor(type)} text-white px-2 py-1 rounded text-xs font-semibold`}
                        >
                          {getRatingLabel(type)}: {rating}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Info */}
                <div className="p-6">
                  <div className="flex items-center gap-3 mb-3 text-sm text-gray-600">
                    <span>{currentMovie.year}</span>
                    <span>•</span>
                    <span>{currentMovie.runtime}</span>
                  </div>

                  <div className="flex gap-2 mb-4 flex-wrap">
                    {currentMovie.genres.map(genre => (
                      <span
                        key={genre}
                        className="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm"
                      >
                        {genre}
                      </span>
                    ))}
                  </div>

                  <p className="text-gray-700 mb-4 line-clamp-3">
                    {currentMovie.description}
                  </p>

                  <div className="mb-4">
                    <h4 className="text-sm font-semibold text-gray-700 mb-2">
                      Available on:
                    </h4>
                    <div className="flex gap-2 flex-wrap">
                      {currentMovie.streaming.map((s, idx) => (
                        <span
                          key={idx}
                          className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-semibold"
                        >
                          {s.service}
                          {s.price && ` - ${s.price}`}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Action Buttons */}
                  <div className="grid grid-cols-4 gap-2">
                    <button
                      onClick={() => handleSwipe('pass')}
                      className="bg-red-500 hover:bg-red-600 text-white py-3 rounded-2xl font-semibold transition"
                    >
                      Pass
                    </button>
                    <button
                      onClick={() => handleSwipe('seen')}
                      className="bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-semibold transition"
                    >
                      Seen
                    </button>
                    <button
                      onClick={() => handleSwipe('watchlist')}
                      className="bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-2xl font-semibold transition"
                    >
                      List
                    </button>
                    <button
                      onClick={() => openDetails(currentMovie)}
                      className="bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-2xl font-semibold transition"
                    >
                      Details
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ==================== DETAILS MODAL ====================

      const renderDetailsModal = () => {
        if (!showDetailsModal || !selectedMovie) return null;

        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto">
              <div className="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
                <h3 className="text-xl font-bold">{selectedMovie.title}</h3>
                <button
                  onClick={() => setShowDetailsModal(false)}
                  className="p-2 hover:bg-gray-100 rounded-full"
                >
                  <XIcon />
                </button>
              </div>

              <div className="p-6">
                <img
                  src={selectedMovie.poster}
                  alt={selectedMovie.title}
                  className="w-full h-64 object-cover rounded-2xl mb-4"
                />

                <div className="mb-4">
                  <h4 className="font-semibold mb-2">Ratings</h4>
                  <div className="grid grid-cols-2 gap-2">
                    {Object.entries(selectedMovie.ratings).map(([type, rating]) => (
                      <div
                        key={type}
                        className={`${getRatingColor(type)} text-white p-3 rounded-xl text-center`}
                      >
                        <div className="text-sm opacity-90">{getRatingLabel(type)}</div>
                        <div className="text-2xl font-bold">{rating}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mb-4">
                  <h4 className="font-semibold mb-2">Description</h4>
                  <p className="text-gray-700">{selectedMovie.description}</p>
                </div>

                <div className="mb-4">
                  <h4 className="font-semibold mb-2">Details</h4>
                  <div className="space-y-1 text-sm text-gray-700">
                    <div>Year: {selectedMovie.year}</div>
                    <div>Runtime: {selectedMovie.runtime}</div>
                    <div>Genres: {selectedMovie.genres.join(', ')}</div>
                  </div>
                </div>

                <div className="mb-6">
                  <h4 className="font-semibold mb-2">Streaming Services</h4>
                  <div className="space-y-2">
                    {selectedMovie.streaming.map((s, idx) => (
                      <div
                        key={idx}
                        className="flex justify-between items-center bg-gray-50 p-3 rounded-xl"
                      >
                        <span className="font-medium">{s.service}</span>
                        <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                          s.type === 'subscription'
                            ? 'bg-green-100 text-green-700'
                            : 'bg-orange-100 text-orange-700'
                        }`}>
                          {s.type === 'subscription' ? 'Included' : s.price}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      handleSwipe('watchlist');
                      setShowDetailsModal(false);
                    }}
                    className="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-2xl font-semibold"
                  >
                    Add to Watchlist
                  </button>
                  <button
                    onClick={() => {
                      handleSwipe('seen');
                      setShowDetailsModal(false);
                    }}
                    className="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-semibold"
                  >
                    Mark as Seen
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ==================== SEARCH TAB ====================

      const renderSearch = () => {
        const filteredResults = searchResults.filter(movie =>
          movie.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          movie.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase()))
        );

        return (
          <div className="max-w-md mx-auto px-4 pt-4 pb-20">
            <h2 className="text-3xl font-bold mb-6 bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
              Search Movies
            </h2>

            <div className="mb-6">
              <input
                type="text"
                placeholder="Search by title or genre..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none"
              />
            </div>

            <div className="space-y-3">
              {filteredResults.map(movie => (
                <div
                  key={movie.id}
                  className="bg-white rounded-2xl shadow-md p-4 flex gap-4"
                >
                  <img
                    src={movie.poster}
                    alt={movie.title}
                    className="w-20 h-28 object-cover rounded-xl"
                  />
                  <div className="flex-1">
                    <h3 className="font-bold mb-1">{movie.title}</h3>
                    <div className="text-sm text-gray-600 mb-2">
                      {movie.year} • {movie.runtime}
                    </div>
                    <div className="flex gap-1 mb-2 flex-wrap">
                      {movie.genres.slice(0, 2).map(genre => (
                        <span
                          key={genre}
                          className="bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full text-xs"
                        >
                          {genre}
                        </span>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => {
                          if (!watchlist.find(m => m.id === movie.id)) {
                            setWatchlist([...watchlist, movie]);
                          }
                        }}
                        className="bg-blue-500 text-white px-3 py-1 rounded-lg text-sm font-semibold"
                      >
                        + Watchlist
                      </button>
                      <button
                        onClick={() => openDetails(movie)}
                        className="bg-purple-500 text-white px-3 py-1 rounded-lg text-sm font-semibold"
                      >
                        Details
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ==================== FRIENDS TAB ====================

      const renderFriends = () => {
        const sampleActivities = [
          {
            id: 1,
            friend: "Sarah Johnson",
            action: "added to watchlist",
            movie: "Everything Everywhere All at Once",
            time: "2 hours ago",
            services: ["Paramount+", "Amazon Prime"]
          },
          {
            id: 2,
            friend: "Mike Chen",
            action: "watched",
            movie: "Oppenheimer",
            time: "5 hours ago",
            services: ["Peacock"]
          },
          {
            id: 3,
            friend: "Emily Davis",
            action: "created list",
            movie: "Weekend Thrillers",
            time: "1 day ago",
            services: []
          }
        ];

        return (
          <div className="max-w-md mx-auto px-4 pt-4 pb-20">
            <h2 className="text-3xl font-bold mb-6 bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
              Friends Activity
            </h2>

            <div className="space-y-4">
              {sampleActivities.map(activity => (
                <div
                  key={activity.id}
                  className="bg-white rounded-2xl shadow-md p-4"
                >
                  <div className="flex items-start gap-3">
                    <div className="w-12 h-12 bg-gradient-to-br from-purple-600 to-pink-600 rounded-full flex items-center justify-center text-white font-bold">
                      {activity.friend.split(' ').map(n => n[0]).join('')}
                    </div>
                    <div className="flex-1">
                      <div className="mb-1">
                        <span className="font-bold">{activity.friend}</span>
                        {' '}
                        <span className="text-gray-600">{activity.action}</span>
                        {' '}
                        <span className="font-semibold text-purple-600">
                          {activity.movie}
                        </span>
                      </div>
                      <div className="text-sm text-gray-500 mb-2">
                        {activity.time}
                      </div>
                      {activity.services.length > 0 && (
                        <div className="flex gap-2">
                          {activity.services.map(service => (
                            <span
                              key={service}
                              className="bg-purple-100 text-purple-700 px-2 py-1 rounded-full text-xs"
                            >
                              {service}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-8 bg-gradient-to-r from-purple-600 to-pink-600 rounded-2xl p-6 text-white text-center">
              <h3 className="text-xl font-bold mb-2">Invite Friends</h3>
              <p className="text-sm mb-4 opacity-90">
                Connect with friends to see what they're watching!
              </p>
              <button className="bg-white text-purple-600 px-6 py-2 rounded-xl font-semibold">
                Send Invites
              </button>
            </div>
          </div>
        );
      };

      // ==================== WATCH PARTY TAB ====================

      const renderWatchParty = () => {
        if (partyState === 'home') {
          return (
            <div className="max-w-md mx-auto px-4 pt-4 pb-20">
              <h2 className="text-3xl font-bold mb-6 bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                Watch Party
              </h2>

              <div className="space-y-4">
                <div
                  className="bg-gradient-to-br from-purple-600 to-pink-600 rounded-3xl p-8 text-white shadow-2xl cursor-pointer hover:shadow-3xl transition"
                  onClick={() => setPartyState('create')}
                >
                  <div className="text-center">
                    <div className="mb-4">
                      <UsersIcon />
                    </div>
                    <h3 className="text-2xl font-bold mb-2">Create Party</h3>
                    <p className="opacity-90">
                      Start a new watch party with friends
                    </p>
                  </div>
                </div>

                <div className="bg-white rounded-3xl p-8 shadow-lg">
                  <h3 className="text-xl font-bold mb-4 text-center">Join Party</h3>
                  <input
                    type="text"
                    placeholder="Enter party code (e.g., MN-1234)"
                    className="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none mb-4"
                  />
                  <button className="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-2xl font-semibold">
                    Join Party
                  </button>
                </div>
              </div>
            </div>
          );
        }

        if (partyState === 'create') {
          return (
            <div className="max-w-md mx-auto px-4 pt-4 pb-20">
              <button
                onClick={() => setPartyState('home')}
                className="mb-4 text-purple-600 font-semibold"
              >
                ← Back
              </button>

              <h2 className="text-3xl font-bold mb-6">Create Watch Party</h2>

              <div className="bg-white rounded-3xl p-6 shadow-lg">
                <div className="mb-6">
                  <label className="block text-sm font-semibold mb-2">
                    Party Name
                  </label>
                  <input
                    type="text"
                    value={partyName}
                    onChange={(e) => setPartyName(e.target.value)}
                    placeholder="e.g., Friday Movie Night"
                    className="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none"
                  />
                </div>

                <button
                  onClick={() => {
                    const code = `MN-${Math.floor(1000 + Math.random() * 9000)}`;
                    setPartyCode(code);
                    setPartyMembers([{ name: 'You', voted: false }]);
                    setPartyState('waiting');
                  }}
                  disabled={!partyName}
                  className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-2xl font-semibold disabled:opacity-50"
                >
                  Create Party
                </button>
              </div>
            </div>
          );
        }

        if (partyState === 'waiting') {
          return (
            <div className="max-w-md mx-auto px-4 pt-4 pb-20">
              <h2 className="text-3xl font-bold mb-6">{partyName}</h2>

              <div className="bg-white rounded-3xl p-6 shadow-lg mb-6">
                <div className="text-center mb-6">
                  <div className="text-6xl font-bold text-purple-600 mb-2">
                    {partyCode}
                  </div>
                  <p className="text-gray-600">Share this code with friends</p>
                </div>

                <div className="bg-gray-100 rounded-2xl p-8 mb-6">
                  <div className="text-center text-gray-500">
                    [QR Code Placeholder]
                  </div>
                </div>

                <div className="mb-6">
                  <h3 className="font-semibold mb-3">Party Members ({partyMembers.length})</h3>
                  <div className="space-y-2">
                    {partyMembers.map((member, idx) => (
                      <div
                        key={idx}
                        className="flex items-center gap-3 bg-gray-50 p-3 rounded-xl"
                      >
                        <div className="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-600 rounded-full flex items-center justify-center text-white font-bold">
                          {member.name[0]}
                        </div>
                        <span className="font-medium">{member.name}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <button
                  onClick={() => {
                    setCurrentPartyMovieIndex(0);
                    setPartyVotes({});
                    setPartyState('matching');
                  }}
                  disabled={partyMembers.length < 1}
                  className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-2xl font-semibold disabled:opacity-50"
                >
                  Start Matching
                </button>
              </div>
            </div>
          );
        }

        if (partyState === 'matching') {
          const movie = SAMPLE_MOVIES[currentPartyMovieIndex];
          const myVote = partyVotes[movie.id];

          const handleVote = (vote) => {
            const newVotes = { ...partyVotes, [movie.id]: vote };
            setPartyVotes(newVotes);

            // Simulate match (in real app, would wait for all members)
            if (vote === 'yes') {
              setTimeout(() => {
                setMatchedMovie(movie);
                setPartyState('matched');
              }, 500);
            } else {
              setTimeout(() => {
                setCurrentPartyMovieIndex((prev) => (prev + 1) % SAMPLE_MOVIES.length);
              }, 500);
            }
          };

          return (
            <div className="max-w-md mx-auto px-4 pt-4 pb-20">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-2xl font-bold">{partyName}</h2>
                <button
                  onClick={() => setPartyState('home')}
                  className="text-red-500 font-semibold"
                >
                  Leave Party
                </button>
              </div>

              <div className="bg-white rounded-3xl shadow-2xl overflow-hidden mb-6">
                <div className="relative">
                  <img
                    src={movie.poster}
                    alt={movie.title}
                    className="w-full h-80 object-cover"
                  />
                  <div className="absolute bottom-0 left-0 right-0 gradient-overlay p-6">
                    <h3 className="text-white text-2xl font-bold">{movie.title}</h3>
                  </div>
                </div>

                <div className="p-6">
                  <div className="flex items-center gap-3 mb-3 text-sm text-gray-600">
                    <span>{movie.year}</span>
                    <span>•</span>
                    <span>{movie.runtime}</span>
                  </div>

                  <div className="flex gap-2 mb-4 flex-wrap">
                    {movie.genres.map(genre => (
                      <span
                        key={genre}
                        className="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm"
                      >
                        {genre}
                      </span>
                    ))}
                  </div>

                  <p className="text-gray-700 mb-4">{movie.description}</p>

                  <div className="mb-6">
                    <h4 className="text-sm font-semibold mb-2">Party Votes</h4>
                    <div className="space-y-2">
                      {partyMembers.map((member, idx) => (
                        <div
                          key={idx}
                          className="flex justify-between items-center"
                        >
                          <span className="text-sm">{member.name}</span>
                          <span className="text-sm text-gray-500">
                            {idx === 0 && myVote ? (
                              myVote === 'yes' ? '✓ Yes' : myVote === 'no' ? '✗ No' : '👁 Seen'
                            ) : (
                              'Waiting...'
                            )}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {!myVote && (
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        onClick={() => handleVote('no')}
                        className="bg-red-500 hover:bg-red-600 text-white py-3 rounded-2xl font-semibold"
                      >
                        No
                      </button>
                      <button
                        onClick={() => handleVote('yes')}
                        className="bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-semibold"
                      >
                        Yes
                      </button>
                      <button
                        onClick={() => handleVote('seen')}
                        className="bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-2xl font-semibold"
                      >
                        Seen
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        if (partyState === 'matched') {
          return (
            <div className="max-w-md mx-auto px-4 pt-4 pb-20">
              <div className="text-center mb-6">
                <div className="text-6xl mb-4">🎉</div>
                <h2 className="text-3xl font-bold mb-2">It's a Match!</h2>
                <p className="text-gray-600">Everyone wants to watch this movie!</p>
              </div>

              <div className="bg-white rounded-3xl shadow-2xl overflow-hidden mb-6">
                <img
                  src={matchedMovie.poster}
                  alt={matchedMovie.title}
                  className="w-full h-64 object-cover"
                />
                <div className="p-6">
                  <h3 className="text-2xl font-bold mb-4">{matchedMovie.title}</h3>

                  <div className="mb-4">
                    <h4 className="font-semibold mb-2">Available on:</h4>
                    <div className="flex gap-2 flex-wrap">
                      {matchedMovie.streaming.map((s, idx) => (
                        <span
                          key={idx}
                          className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-semibold"
                        >
                          {s.service}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <button className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-2xl font-semibold">
                      Watch Now
                    </button>
                    <button
                      onClick={() => {
                        setPartyState('home');
                        setMatchedMovie(null);
                        setPartyVotes({});
                      }}
                      className="w-full bg-gray-200 text-gray-700 py-3 rounded-2xl font-semibold"
                    >
                      Start New Party
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }
      };

      // ==================== PROFILE TAB ====================

      const renderProfile = () => {
        return (
          <div className="max-w-md mx-auto px-4 pt-4 pb-20">
            <h2 className="text-3xl font-bold mb-6 bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
              My Profile
            </h2>

            <div className="space-y-4 mb-8">
              {/* Watchlist Card */}
              <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-3xl p-6 text-white shadow-lg">
                <div className="flex justify-between items-start mb-2">
                  <h3 className="text-2xl font-bold">🔖 Watchlist</h3>
                  <span className="bg-white bg-opacity-30 px-3 py-1 rounded-full text-sm font-semibold">
                    {watchlist.length}
                  </span>
                </div>
                <p className="text-sm opacity-90 mb-4">
                  Movies you want to watch
                </p>
                {watchlist.length > 0 && (
                  <div className="flex gap-2 -mb-2 overflow-x-auto">
                    {watchlist.slice(0, 3).map(movie => (
                      <img
                        key={movie.id}
                        src={movie.poster}
                        alt={movie.title}
                        className="w-16 h-24 object-cover rounded-lg"
                      />
                    ))}
                  </div>
                )}
              </div>

              {/* Seen Movies Card */}
              <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-3xl p-6 text-white shadow-lg">
                <div className="flex justify-between items-start mb-2">
                  <h3 className="text-2xl font-bold">✓ Movies I've Seen</h3>
                  <span className="bg-white bg-opacity-30 px-3 py-1 rounded-full text-sm font-semibold">
                    {seenMovies.length}
                  </span>
                </div>
                <p className="text-sm opacity-90 mb-4">
                  Ready to rank when you want
                </p>
                {seenMovies.length > 0 && (
                  <div className="flex gap-2 -mb-2 overflow-x-auto">
                    {seenMovies.slice(0, 3).map(movie => (
                      <img
                        key={movie.id}
                        src={movie.poster}
                        alt={movie.title}
                        className="w-16 h-24 object-cover rounded-lg"
                      />
                    ))}
                  </div>
                )}
              </div>

              {/* Master Ranked List */}
              <div className="bg-gradient-to-br from-yellow-500 to-orange-500 rounded-3xl p-6 text-white shadow-lg">
                <div className="flex justify-between items-start mb-2">
                  <h3 className="text-2xl font-bold">🏆 Master Ranked List</h3>
                  <span className="bg-white bg-opacity-30 px-3 py-1 rounded-full text-sm font-semibold">
                    {seenMovies.length}
                  </span>
                </div>
                <p className="text-sm opacity-90">
                  Your top-rated movies
                </p>
              </div>
            </div>

            {/* Custom Lists */}
            <div className="mb-6">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-xl font-bold">Custom Lists</h3>
                <button className="bg-purple-600 text-white p-2 rounded-full">
                  <PlusIcon />
                </button>
              </div>

              <div className="space-y-3">
                {customLists.map(list => (
                  <div
                    key={list.id}
                    className="bg-white rounded-2xl shadow-md p-4"
                  >
                    <div className="flex justify-between items-center">
                      <div>
                        <h4 className="font-bold">{list.name}</h4>
                        <p className="text-sm text-gray-500">
                          {list.movies.length} movies
                        </p>
                      </div>
                      {list.movies.length > 0 && (
                        <div className="flex gap-1">
                          {list.movies.slice(0, 2).map(movie => (
                            <img
                              key={movie.id}
                              src={movie.poster}
                              alt={movie.title}
                              className="w-12 h-16 object-cover rounded"
                            />
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Settings Section */}
            <div className="bg-white rounded-3xl shadow-lg p-6">
              <h3 className="text-xl font-bold mb-4">My Streaming Services</h3>
              <div className="space-y-2 mb-6">
                {ALL_STREAMING_SERVICES.map(service => (
                  <label
                    key={service}
                    className="flex items-center gap-3 p-2 hover:bg-gray-50 rounded-lg cursor-pointer"
                  >
                    <input
                      type="checkbox"
                      checked={userServices.includes(service)}
                      onChange={(e) => {
                        if (e.target.checked) {
                          setUserServices([...userServices, service]);
                        } else {
                          setUserServices(userServices.filter(s => s !== service));
                        }
                      }}
                      className="w-4 h-4"
                    />
                    <span>{service}</span>
                  </label>
                ))}
              </div>

              <div className="text-xs text-gray-500 text-center pt-4 border-t">
                <p>Powered by TMDb</p>
                <p>Data from OMDb API</p>
              </div>
            </div>
          </div>
        );
      };

      // ==================== BOTTOM NAVIGATION ====================

      const renderBottomNav = () => {
        const tabs = [
          { id: 'feed', label: 'Feed', icon: <HomeIcon /> },
          { id: 'search', label: 'Search', icon: <SearchIcon /> },
          { id: 'friends', label: 'Friends', icon: <HeartIcon /> },
          { id: 'party', label: 'Party', icon: <UsersIcon /> },
          { id: 'profile', label: 'Profile', icon: <ListIcon /> }
        ];

        return (
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg">
            <div className="max-w-md mx-auto">
              <div className="flex justify-around items-center py-2">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition ${
                      activeTab === tab.id
                        ? 'text-purple-600 bg-purple-50'
                        : 'text-gray-500'
                    }`}
                  >
                    {tab.icon}
                    <span className="text-xs font-medium">{tab.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // ==================== MAIN RENDER ====================

      return (
        <div className="min-h-screen bg-gray-50">
          {activeTab === 'feed' && renderFeed()}
          {activeTab === 'search' && renderSearch()}
          {activeTab === 'friends' && renderFriends()}
          {activeTab === 'party' && renderWatchParty()}
          {activeTab === 'profile' && renderProfile()}

          {renderDetailsModal()}
          {renderBottomNav()}
        </div>
      );
    }

    // ==================== RENDER APP ====================

    ReactDOM.render(<MovieMatchApp />, document.getElementById('root'));
  </script>
</body>
</html>
